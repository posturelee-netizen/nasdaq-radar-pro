<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NASDAQ RADAR PRO V3</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e1b;color:#eaf2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:920px;margin:auto;padding:22px 16px 60px}h1{font-size:25px;margin:4px 0}p{color:#a9b7cf;line-height:1.5}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{background:#253149;border:1px solid #4b607d;color:#dceaff;padding:6px 9px;border-radius:9px;font-size:12px}
.notice{border:1px solid #52617a;border-radius:12px;padding:12px;margin:17px 0;background:#151e31;color:#e2eaf9;font-size:13px}
.controls{display:grid;grid-template-columns:1fr auto;gap:9px;margin:16px 0}input,select,button{background:#172238;color:#f5f8ff;border:1px solid #43536e;border-radius:10px;padding:12px;font-size:15px}button{cursor:pointer}button.active{background:#0e747e;border-color:#3ce3dc}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px}.filters button{font-size:13px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#141e31;padding:12px;border-radius:12px;border:1px solid #293a55}.stat strong{display:block;font-size:22px;margin-top:5px}.stat small{color:#a8b7ce}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{border:1px solid #32415c;background:#121c2e;border-radius:15px;padding:16px}.head{display:flex;align-items:center;justify-content:space-between}.ticker{font-size:23px;font-weight:800}.name{color:#a9b8ce;font-size:13px;margin:5px 0 12px}.signal{font-size:12px;border-radius:8px;padding:6px 8px;background:#28374d}.buy{color:#72f3c0}.warn{color:#ffb09f}.watch{color:#ffda85}.rows{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.cell{background:#0b1425;padding:10px;border-radius:9px}.cell small{display:block;color:#9eacc3;margin-bottom:5px}.cell b{font-size:16px}.reason{font-size:13px;line-height:1.5;border-top:1px solid #2b3951;padding-top:11px;color:#d7e1f2}.foot{font-size:12px;color:#91a0b8;margin-top:22px}#empty{display:none;text-align:center;padding:35px;color:#b7c4d7}
</style></head><body><main>
<div class="top"><div><h1>📡 NASDAQ RADAR PRO</h1><p style="margin:3px 0">V3 · 종목 신호 대시보드</p></div><span class="tag">DEMO · 무료 테스트</span></div>
<div class="notice"><b>⚠️ 실제 시세가 아닙니다.</b><br>아래 종목·가격·거래량·신호는 UI와 규칙을 테스트하기 위한 가상 데이터입니다. 나스닥 전체 자동 검색, 실시간 SEC 조회, 푸시 알림은 아직 연결되지 않았습니다.</div>
<div class="stats"><div class="stat"><small>샘플 종목</small><strong id="total">0</strong></div><div class="stat"><small>매수 관심</small><strong id="buys">0</strong></div><div class="stat"><small>주의 신호</small><strong id="warnings">0</strong></div></div>
<div class="controls"><input id="search" placeholder="티커 / 회사명 검색" aria-label="종목 검색"><select id="sort" aria-label="정렬"><option value="volume">거래량 급증순</option><option value="ticker">티커순</option><option value="change">등락률순</option></select></div>
<div class="filters"><button class="active" data-filter="all">전체</button><button data-filter="buy">🟢 매수 관심</button><button data-filter="watch">🟡 관찰</button><button data-filter="warn">🔴 주의</button></div>
<div id="cards" class="cards"></div><div id="empty">조건에 맞는 샘플 종목이 없습니다.</div>
<p class="foot">판정 예시: 1분 거래량 ≥ 평소 대비 3배 + 현재가 > VWAP + 현재가 > 9EMA → 매수 관심. 희석 위험 표시는 별도 검증 필요. 투자 권유가 아닙니다.</p>
</main><script>
const stocks=[
{t:"ABCD",n:"Alpha Bio Demo",price:1.42,change:12.8,vol:5.7,vwap:1.34,ema:1.37,dilution:"미확인"},
{t:"NOVA",n:"Nova Tech Sample",price:3.18,change:7.3,vol:3.4,vwap:3.04,ema:3.11,dilution:"미확인"},
{t:"PULSE",n:"Pulse Energy Mock",price:0.86,change:-4.5,vol:6.2,vwap:0.91,ema:0.89,dilution:"검토 필요(가상)"},
{t:"QBIT",n:"Quantum Sample Labs",price:5.24,change:2.1,vol:2.1,vwap:5.17,ema:5.19,dilution:"미확인"},
{t:"RAY",n:"Ray Robotics Demo",price:2.05,change:16.2,vol:4.8,vwap:1.94,ema:1.98,dilution:"미확인"},
{t:"VOLT",n:"Volt Mobility Mock",price:0.73,change:-8.1,vol:3.8,vwap:0.79,ema:0.77,dilution:"검토 필요(가상)"}
];
let filter="all";
function status(s){return s.vol>=3&&s.price>s.vwap&&s.price>s.ema?"buy":s.price<s.vwap&&s.price<s.ema?"warn":"watch"}
function render(){
const query=document.getElementById("search").value.trim().toLowerCase(),sort=document.getElementById("sort").value;
const list=stocks.filter(s=>(filter==="all"||status(s)===filter)&&(s.t.toLowerCase().includes(query)||s.n.toLowerCase().includes(query))).sort((a,b)=>sort==="ticker"?a.t.localeCompare(b.t):sort==="change"?b.change-a.change:b.vol-a.vol);
document.getElementById("total").textContent=stocks.length;document.getElementById("buys").textContent=stocks.filter(s=>status(s)==="buy").length;document.getElementById("warnings").textContent=stocks.filter(s=>status(s)==="warn").length;
document.getElementById("cards").innerHTML=list.map(s=>{const st=status(s),label=st==="buy"?"🟢 매수 관심":st==="warn"?"🔴 매도 주의":"🟡 관찰",why=st==="buy"?"거래량 급증 + VWAP/9EMA 상단":st==="warn"?"VWAP·9EMA 하단: 약세 주의":"조건 일부만 충족";return `<article class="card"><div class="head"><span class="ticker">${s.t}</span><span class="signal ${st}">${label}</span></div><div class="name">${s.n}</div><div class="rows"><div class="cell"><small>샘플 가격</small><b>$${s.price.toFixed(2)}</b></div><div class="cell"><small>샘플 등락률</small><b class="${s.change>=0?"buy":"warn"}">${s.change>0?"+":""}${s.change.toFixed(1)}%</b></div><div class="cell"><small>1분 거래량 배수</small><b>${s.vol.toFixed(1)}×</b></div><div class="cell"><small>VWAP / 9EMA</small><b>$${s.vwap.toFixed(2)} / $${s.ema.toFixed(2)}</b></div></div><div class="reason"><b>신호 근거:</b> ${why}<br><b>SEC 희석 리스크:</b> ${s.dilution} · 실제 공시 미조회</div></article>`}).join("");
document.getElementById("empty").style.display=list.length?"none":"block";
}
document.getElementById("search").addEventListener("input",render);document.getElementById("sort").addEventListener("change",render);document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));render();
</script></body></html>
