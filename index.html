<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151e"><title>NASDAQ RADAR PRO</title><style>body{margin:0;background:#0d121b;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:650px;margin:auto;padding:20px 14px 60px}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#99a8bb}.tag{font-size:12px;color:#ffc66d;border:1px solid #66532e;border-radius:30px;padding:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat,.card{background:#171f2b;border:1px solid #2b394b;border-radius:15px;padding:14px}.stat{text-align:center}.stat b{display:block;margin-top:8px}.filters{display:flex;gap:8px;overflow:auto}button{background:#243044;border:1px solid #3b4b62;color:#f4f7fb;border-radius:20px;padding:10px 14px;cursor:pointer;white-space:nowrap}.active{background:#146d58;border-color:#26b48e}.card{margin-top:14px}.top,.price,.line{display:flex;justify-content:space-between;align-items:center}.top h2{margin:0}.price{margin:16px 0}.price strong{font-size:27px}.up{color:#ff6579}.down{color:#38d3a5}.signal{border-radius:10px;padding:12px;background:#283342;margin:10px 0}.line{padding:9px 0;border-bottom:1px solid #2c3748;font-size:14px}.risk{background:#3b3022;color:#ffd48d;border-radius:8px;padding:9px;font-size:13px;margin:9px 0}.foot{font-size:12px;color:#aab5c5;line-height:1.6;margin-top:25px}input{background:#243044;border:1px solid #3b4b62;color:white;padding:10px;border-radius:9px;width:90px}</style></head><body><main><header><div><small>NASDAQ SCANNER</small><h1>RADAR <span class="up">PRO</span></h1></div><span class="tag">● DEMO · 무료</span></header><div class="stats"><div class="stat"><small>감시 범위</small><b>샘플 4종목</b></div><div class="stat"><small>포착 후보</small><b id="count">4</b></div><div class="stat"><small>신호 기준</small><b>1분봉</b></div></div><div class="filters" id="filters"><button class="active" data-filter="all">전체</button><button data-filter="buy">매수 관심</button><button data-filter="sell">매도 경고</button><button data-filter="risk">희석 주의</button></div><p><button id="sort">거래량순 ↓</button> <button id="notify">🔔 알림 테스트</button></p><div id="cards"></div><p class="foot">⚠️ 모든 종목명·가격·거래량·공시 상태는 가상 테스트 데이터입니다. 실제 시장에 연결되어 있지 않으며 매매에 사용하면 안 됩니다. 매수 관심은 자동 매수 주문이 아닙니다.</p></main><script>const data=[{s:'DEMO-A',p:.0953,g:45.3,v:5.9,vwap:.0823,ema:.0860,low:.0608,high:.1000,risk:true,buy:true},{s:'DEMO-B',p:.2840,g:18.6,v:8.2,vwap:.2610,ema:.2690,low:.2310,high:.2910,risk:false,buy:true},{s:'DEMO-C',p:.4150,g:-7.4,v:3.4,vwap:.4380,ema:.4290,low:.4030,high:.4890,risk:true,buy:false},{s:'DEMO-D',p:1.23,g:9.1,v:4.1,vwap:1.19,ema:1.21,low:1.13,high:1.28,risk:false,buy:true}];let filter='all',sort='v';function render(){let rows=data.filter(x=>filter==='all'||(filter==='risk'?x.risk:filter==='buy'?x.buy:!x.buy)).sort((a,b)=>b[sort]-a[sort]);document.querySelector('#count').textContent=rows.length;document.querySelector('#cards').innerHTML=rows.map(x=>`<section class="card" style="border-color:${x.buy?'#d85164':'#30aa89'}"><div class="top"><h2>${x.s}</h2><small>${x.risk?'⚠️ 희석 검토':'공시 확인 전'}</small></div><small>테스트 전용 가상 종목</small><div class="price"><strong>$${x.p.toFixed(4)}</strong><strong class="${x.g>=0?'up':'down'}">${x.g>0?'+':''}${x.g}%</strong></div><div class="signal"><b class="${x.buy?'up':'down'}">1분 거래량 ×${x.v}</b><div style="margin-top:8px">${x.buy?'🚀 매수 관심 조건 감지':'⚠️ 추세 이탈 경고'}</div></div>${x.risk?'<div class="risk">⚠️ 희석 위험: 실제 SEC 확인 필요</div>':''}${[['VWAP',x.vwap,x.p>x.vwap],['9EMA',x.ema,x.p>x.ema],['직전 저점',x.low,x.p>x.low],['당일 고점 돌파',x.high,x.p>=x.high]].map(z=>`<div class="line"><span>${z[0]} $${z[1].toFixed(4)}</span><b class="${z[2]?'down':'up'}">${z[2]?'OK':'주의'}</b></div>`).join('')}</section>`).join('')||'<p>조건에 맞는 종목이 없습니다.</p>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(z=>z.classList.toggle('active',z===b));render()});document.querySelector('#sort').onclick=()=>{sort=sort==='v'?'g':'v';document.querySelector('#sort').textContent=sort==='v'?'거래량순 ↓':'상승률순 ↓';render()};document.querySelector('#notify').onclick=()=>alert('🔔 DEMO-A: 1분 거래량 ×5.9 · 매수 관심 (테스트 알림, 실제 푸시 아님)');render();</script></body></html>
